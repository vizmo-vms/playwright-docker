name: Publish ghcr image

# vizmo-vms build of the chromium-server image on a patched Node, pinned to the
# Playwright version the platform server's client uses (they must match exactly).
on:
  push:
    branches:
      - vizmo/node-24.22.1
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/playwright
  PLAYWRIGHT_VERSION: 1.60.0
  NODE_VERSION: 24.22.1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the Dockerfile Node pin
        run: grep -qx "ENV NODE_VERSION \"${NODE_VERSION}\"" Dockerfile

      # arm64 is built under emulation for local arm64 clusters (Colima on Apple Silicon); OKE is amd64.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=chromium-server-${{ env.PLAYWRIGHT_VERSION }}-node${{ env.NODE_VERSION }}
            type=sha,prefix=chromium-server-${{ env.PLAYWRIGHT_VERSION }}-sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: chromium-server
          build-args: |
            PLAYWRIGHT_VERSION=${{ env.PLAYWRIGHT_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify Node and Playwright in the published image
        run: |
          image="${IMAGE_NAME}:chromium-server-${PLAYWRIGHT_VERSION}-node${NODE_VERSION}"
          for platform in linux/amd64 linux/arm64; do
            test "$(docker run --rm --platform "$platform" "$image" node -v)" = "v${NODE_VERSION}"
            test "$(docker run --rm --platform "$platform" -w /server "$image" node node_modules/playwright-core/cli.js --version)" = "Version ${PLAYWRIGHT_VERSION}"
            echo "$platform ok"
          done
